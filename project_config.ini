;==============================================
; КОНФИГУРАЦИЯ ПРОЕКТА MaX
;==============================================

[PROJECT]
PROJECT_NAME = MaX
PRODUCT_ID = MAX_001
INITIAL_VERSION = v0.1.0
PRODUCT_VARIANT = debug, release, production
CHANGELOG_STYLE = Keep a Changelog
CI_PIPELINE_ENABLED = false
VSCODE_CONFIG_NEEDED = false

[MCU]
SUPPORTED_MCU_FAMILIES = stm32
TARGET_MCU_MODELS = stm32f302r8, stm32l412rb, stm32h734
SUPPORTED_HARDWARE_REVISIONS = hard_f302, hard_l412, hard_h734

PLATFORM_DEFINES = \
    stm32f302r8: USE_STM32F302R8, F302_M4, NO_OS \
    stm32l412rb: USE_STM32L412RB, L4_SERIES, ULP_ENABLED \
    stm32h734: USE_STM32H734, H7_SERIES, CACHE_ENABLE

IAR_LINKER_SCRIPTS = \
    stm32f302r8: stm32f302r8_flash.icf \
    stm32l412rb: stm32l412rb_flash.icf \
    stm32h734: stm32h734_flash.icf

[MODULES]
PROJECT_MODULES = errors, storage, gui, uart

EXTERNAL_SUBMODULES = \
    name: TinyUART \
    repo_url: git@github.com:example/tinyuart.git \
    branch: main \
    parent_module: uart

[MODULE_errors]
CONFIG_STRUCTURE = flat
DEPENDENCIES = none
MCU_INTERFACES = SCB, RCC
ERROR_STRATEGY = led_indication, logging

[MODULE_storage]
CONFIG_STRUCTURE = flat
DEPENDENCIES = errors
MCU_INTERFACES = FLASH, RCC

[MODULE_gui]
CONFIG_STRUCTURE = nested
DEPENDENCIES = errors, uart
MCU_INTERFACES = GPIO, EXTI, TIM

GUI_SUBMODULES = \
    name: button pins: PA0, PB1, PC13 interrupt: EXTI0, EXTI1, EXTI13 \
    name: led pins: PA5, PB3, PC9 timers: TIM2, TIM3

[APP]
APP_MODULES = gui_app, uart_app, errors_app
APP_EVENT_HANDLERS = true
APP_EVENTS = BUTTON_PRESSED, BUTTON_LONG_PRESS, LED_STATE_CHANGED, UART_DATA_RECEIVED
APP_ERROR_STRATEGY = led_indication

[BUILD]
BUILD_VARIANTS = debug, release, production

[HARDWARE_VARIANTS]
hard_f302 = MCU: stm32f302r8, HSE_VALUE: 8000000, LED_PORT: GPIOA, LED_PIN: 5
hard_l412 = MCU: stm32l412rb, HSE_VALUE: 16000000, LED_PORT: GPIOB, LED_PIN: 3
hard_h734 = MCU: stm32h734, HSE_VALUE: 25000000, LED_PORT: GPIOC, LED_PIN: 9