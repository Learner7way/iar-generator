; Конфигурация путей конвейера py_generator.
; Читается core/config.py. Значения поддерживают %ENV_VAR%.
; Все относительные пути разрешаются от корня репозитория.

[paths]
output_file = py_out.md
answer_file = py_in.txt
formatted_file = py_in_simplified.txt
buffer_file = buffer_py_in.txt
task_file = task.txt
history_dir = history
prompt_file = promt.md
prompt_py_file = promt_py.md
ai_config = ai_config.ini